<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo · Etiquetas — Bauer Lemans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF; --paper:#F7F6F3; --ink:#14110F;
    --red:#D91E2B; --line:#E4E1DB; --gray:#8A8680;
    --accent:#111111; --accent-dim:#e8e8e8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;}
  .wrap{max-width:1200px;margin:0 auto;padding:0 28px;}

  header.topbar{background:var(--ink);color:var(--white);padding:16px 0;}
  header.topbar .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
  .back-link{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#bbb;text-decoration:none;}
  .back-link:hover{color:#fff;}
  .module-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:0.06em;text-transform:uppercase;}
  #connStatus{font-size:11px;color:#888;}

  .brand-selector{background:var(--white);border-bottom:1px solid var(--line);padding:18px 0;}
  .brand-selector .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .brand-btn{display:flex;align-items:center;gap:10px;padding:10px 18px;border:1.5px solid var(--line);border-radius:3px;background:var(--white);cursor:pointer;font-family:'Oswald',sans-serif;font-weight:500;font-size:13px;transition:border-color .2s, background .2s;}
  .brand-btn.active{border-color:var(--pill-color, var(--accent));background:var(--pill-dim, var(--accent-dim));color:var(--pill-color, var(--accent));}

  main{padding:28px 0 60px;}
  .layout{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start;}
  @media (max-width:800px){ .layout{grid-template-columns:1fr;} }

  .panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px;}
  .panel h3{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;margin-bottom:12px;letter-spacing:.02em;}
  input[type=text], input[type=search], input[type=file]{font-family:'Work Sans',sans-serif;font-size:13px;}
  input[type=text], input[type=search]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:3px;margin-bottom:10px;}

  .prod-list{max-height:520px;overflow-y:auto;}
  .prod-item{padding:9px 10px;border-radius:4px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .prod-item:hover{background:var(--paper);}
  .prod-item.active{background:var(--accent-dim);font-weight:600;}
  .prod-item .cnt{font-size:10px;background:#eee;color:#666;border-radius:10px;padding:1px 7px;flex-shrink:0;}
  .prod-item.active .cnt{background:rgba(0,0,0,.12);}
  .prod-codigo{font-family:monospace;font-size:10px;color:var(--gray);display:block;}

  .empty-hint{color:var(--gray);font-size:13px;padding:20px 4px;}

  .btn{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:3px;cursor:pointer;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{opacity:.88;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn.danger{background:#fff;color:var(--red);border:1px solid var(--red);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .label-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--paper);border-radius:5px;margin-bottom:10px;}
  .label-row .info{flex:1;min-width:0;}
  .label-row .name{font-weight:600;font-size:13px;}
  .label-row .meta{font-size:11px;color:var(--gray);margin-top:2px;word-break:break-all;}

  .add-form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:16px;}
  .add-form .field{flex:1;min-width:160px;}
  .add-form label{font-size:11px;color:var(--gray);font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px;}

  .msg{padding:11px 14px;border-radius:3px;margin-bottom:16px;font-size:13px;}
  .msg.ok{background:#e8f3e0;color:#3a6b1f;}
  .msg.err{background:#fbe6e4;color:#a4302a;}

  .progress-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px;display:none;}
  .progress-bar .fill{height:100%;background:var(--accent);width:30%;transition:width .2s;}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="back-link" href="https://crm-lasingluten.github.io/bauer-lemans/">← Portal Bauer Lemans</a>
    <div class="module-title">Módulo · Etiquetas</div>
    <div id="connStatus">conectando...</div>
  </div>
</header>

<div class="brand-selector">
  <div class="wrap" id="brandPills"></div>
</div>

<main>
  <div class="wrap">
    <div id="globalMsg"></div>
    <div class="layout">
      <div class="panel">
        <h3 id="panelTitleIzq">Productos</h3>
        <div id="clienteInputWrap" style="display:none;">
          <input type="text" id="clienteNombreInput" placeholder="Escribí el nombre del producto..." oninput="renderClienteList()">
          <button class="btn" style="width:100%;justify-content:center;margin-bottom:14px;" onclick="usarNombreCliente()">+ Usar este nombre</button>
        </div>
        <input type="search" id="filtroProducto" placeholder="Buscar por nombre o código..." oninput="renderProdList()" style="display:none;">
        <div id="prodList" class="prod-list"></div>
      </div>

      <div class="panel" id="panelDerecho">
        <div class="empty-hint">Elegí o escribí un producto a la izquierda para ver y subir sus etiquetas.</div>
      </div>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://lbbpnnvwtanurtjqgcqv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiYnBubnZ3dGFudXJ0anFnY3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3NjM2NDEsImV4cCI6MjA5MjMzOTY0MX0.a25lrgUlzDM4TSp4c6KOCQ3ERZnSk8-5r2y9DbhRPxg";
const BUCKET = "etiquetas";

const headers = {
  "apikey": SUPABASE_ANON_KEY,
  "Authorization": "Bearer " + SUPABASE_ANON_KEY,
  "Content-Type": "application/json",
  "Prefer": "return=representation"
};

async function sbGet(path){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {headers});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPost(table, body){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {method:"POST", headers, body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDel(table, id){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {method:"DELETE", headers});
  if(!r.ok) throw new Error(await r.text());
  return true;
}

const BRANDS = {
  bocado:      { label: "Bocado Functional Foods", color:"#111111", dim:"#e8e8e8", source:"table", table:"bocado_product_specs", fields:"id,codigo,nombre" },
  rietmann:    { label: "Rietmann Ibérica",         color:"#D91E2B", dim:"#F4D9DB", source:"table", table:"product_specs",        fields:"id,articulo_no,nombre" },
  lasinlgluten:{ label: "La Sin Gluten",            color:"#2f7a4f", dim:"#dcefe2", source:"table", table:"productos",            fields:"id,codigo,nombre", filter:"linea_negocio=eq.La Sin Gluten" },
  clientes:    { label: "Marca de clientes",        color:"#6b5b95", dim:"#e7e3f0", source:"manual" }
};
let CURRENT_BRAND = "bocado";
let PRODUCTS = [];        // productos de la tabla origen (para brands con source:'table')
let LABEL_COUNTS = {};    // producto_ref_id (o nombre para clientes) -> cantidad de etiquetas
let SELECTED_PRODUCT = null; // {ref_id, codigo, nombre}
let CLIENTE_NOMBRES = []; // nombres distintos ya usados en 'clientes'

function showMsg(text, type="ok"){
  const el = document.getElementById("globalMsg");
  el.innerHTML = `<div class="msg ${type}">${text}</div>`;
  setTimeout(()=>{ el.innerHTML=""; }, 5000);
}

function renderPills(){
  const wrap = document.getElementById("brandPills");
  wrap.innerHTML = Object.keys(BRANDS).map(key=>{
    const b = BRANDS[key];
    const active = key===CURRENT_BRAND;
    return `<button class="brand-btn ${active?'active':''}" style="--pill-color:${b.color};--pill-dim:${b.dim};" onclick="selectBrand('${key}')">${b.label}</button>`;
  }).join("");
}

function selectBrand(key){
  CURRENT_BRAND = key;
  SELECTED_PRODUCT = null;
  document.documentElement.style.setProperty('--accent', BRANDS[key].color);
  document.documentElement.style.setProperty('--accent-dim', BRANDS[key].dim);
  renderPills();
  document.getElementById("clienteInputWrap").style.display = BRANDS[key].source==='manual' ? 'block' : 'none';
  document.getElementById("filtroProducto").style.display = BRANDS[key].source==='table' ? 'block' : 'none';
  document.getElementById("filtroProducto").value = "";
  document.getElementById("clienteNombreInput").value = "";
  document.getElementById("panelTitleIzq").textContent = BRANDS[key].source==='manual' ? "Producto (nombre libre)" : "Productos";
  document.getElementById("panelDerecho").innerHTML = `<div class="empty-hint">Elegí o escribí un producto a la izquierda para ver y subir sus etiquetas.</div>`;
  loadBrandData();
}

async function loadBrandData(){
  const b = BRANDS[CURRENT_BRAND];
  document.getElementById("connStatus").textContent = "cargando...";
  try{
    // siempre traemos los conteos de etiquetas de esta marca
    const files = await sbGet(`etiqueta_files?business_line=eq.${CURRENT_BRAND}&select=producto_ref_id,producto_nombre`);
    LABEL_COUNTS = {};
    files.forEach(f=>{
      const key = f.producto_ref_id || f.producto_nombre;
      LABEL_COUNTS[key] = (LABEL_COUNTS[key]||0) + 1;
    });

    if(b.source === 'table'){
      let q = `${b.table}?select=${b.fields}&order=nombre.asc`;
      if(b.filter) q += '&' + b.filter;
      PRODUCTS = await sbGet(q);
      renderProdList();
    }else{
      CLIENTE_NOMBRES = Array.from(new Set(files.map(f=>f.producto_nombre))).sort();
      renderClienteList();
    }
    document.getElementById("connStatus").textContent = b.label;
  }catch(e){
    document.getElementById("connStatus").textContent = "Error de conexión";
    showMsg("Error cargando datos: "+e.message, "err");
  }
}

function codigoDe(p){
  return p.codigo || p.articulo_no || '';
}

function renderProdList(){
  const filtro = document.getElementById("filtroProducto").value.trim().toLowerCase();
  const list = PRODUCTS.filter(p=>{
    if(!filtro) return true;
    return (p.nombre||'').toLowerCase().includes(filtro) || (codigoDe(p)||'').toLowerCase().includes(filtro);
  });
  const el = document.getElementById("prodList");
  if(!list.length){ el.innerHTML = `<div class="empty-hint">No hay productos para esta marca todavía.</div>`; return; }
  el.innerHTML = list.map(p=>{
    const active = SELECTED_PRODUCT && SELECTED_PRODUCT.ref_id === String(p.id);
    const count = LABEL_COUNTS[String(p.id)] || 0;
    const dataStr = JSON.stringify({ref_id:String(p.id),codigo:codigoDe(p),nombre:p.nombre}).replace(/'/g,"&#39;");
    return `<div class="prod-item ${active?'active':''}" onclick='selectProduct(${dataStr})'>
      <div><span class="prod-codigo">${codigoDe(p)}</span>${p.nombre}</div>
      ${count>0?`<span class="cnt">${count}</span>`:''}
    </div>`;
  }).join("");
}

function renderClienteList(){
  const filtro = document.getElementById("clienteNombreInput").value.trim().toLowerCase();
  const list = CLIENTE_NOMBRES.filter(n=> !filtro || n.toLowerCase().includes(filtro));
  const el = document.getElementById("prodList");
  if(!list.length){ el.innerHTML = `<div class="empty-hint">Todavía no cargaste ningún producto de clientes. Escribí un nombre arriba y tocá "Usar este nombre".</div>`; return; }
  el.innerHTML = list.map(n=>{
    const active = SELECTED_PRODUCT && SELECTED_PRODUCT.nombre === n;
    const count = LABEL_COUNTS[n] || 0;
    const dataStr = JSON.stringify({ref_id:null,codigo:"",nombre:n}).replace(/'/g,"&#39;");
    return `<div class="prod-item ${active?'active':''}" onclick='selectProduct(${dataStr})'>
      <div>${n}</div>
      ${count>0?`<span class="cnt">${count}</span>`:''}
    </div>`;
  }).join("");
}

function usarNombreCliente(){
  const nombre = document.getElementById("clienteNombreInput").value.trim();
  if(!nombre){ showMsg("Escribí un nombre de producto primero.", "err"); return; }
  selectProduct({ref_id:null, codigo:"", nombre});
}

function selectProduct(p){
  SELECTED_PRODUCT = p;
  if(BRANDS[CURRENT_BRAND].source==='table') renderProdList(); else renderClienteList();
  renderDetalle();
}

async function renderDetalle(){
  const panel = document.getElementById("panelDerecho");
  if(!SELECTED_PRODUCT){ panel.innerHTML = `<div class="empty-hint">Elegí o escribí un producto a la izquierda.</div>`; return; }
  panel.innerHTML = `<div class="empty-hint">Cargando etiquetas...</div>`;
  try{
    let q = `etiqueta_files?business_line=eq.${CURRENT_BRAND}`;
    if(SELECTED_PRODUCT.ref_id){
      q += `&producto_ref_id=eq.${SELECTED_PRODUCT.ref_id}`;
    }else{
      q += `&producto_nombre=eq.${encodeURIComponent(SELECTED_PRODUCT.nombre)}`;
    }
    const archivos = await sbGet(q + "&order=created_at.asc");
    pintarDetalle(archivos);
  }catch(e){
    panel.innerHTML = `<div class="empty-hint">Error cargando etiquetas: ${e.message}</div>`;
  }
}

function pintarDetalle(archivos){
  const panel = document.getElementById("panelDerecho");
  const codigoLine = SELECTED_PRODUCT.codigo ? `<div style="font-family:monospace;font-size:12px;color:var(--gray);margin-bottom:2px;">${SELECTED_PRODUCT.codigo}</div>` : '';
  const filasHTML = archivos.length ? archivos.map(a=>{
    const url = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${a.storage_path}`;
    return `<div class="label-row">
      <div class="info">
        <div class="name">${a.etiqueta_nombre}</div>
        <div class="meta">${a.file_name||''} · ${formatBytes(a.file_size_bytes)}</div>
      </div>
      <a class="btn secondary" href="${url}" target="_blank">Ver</a>
      <button class="btn danger" onclick="eliminarEtiqueta('${a.id}')">Eliminar</button>
    </div>`;
  }).join("") : `<div class="empty-hint">Todavía no hay etiquetas cargadas para este producto.</div>`;

  panel.innerHTML = `
    ${codigoLine}
    <h3 style="margin-bottom:16px;">${SELECTED_PRODUCT.nombre}</h3>
    <div id="labelsList">${filasHTML}</div>
    <div class="add-form">
      <div class="field">
        <label>Nombre de la etiqueta</label>
        <input type="text" id="nuevaEtiquetaNombre" placeholder="Ej: Delantera, Trasera...">
      </div>
      <div class="field">
        <label>Archivo PDF</label>
        <input type="file" id="nuevaEtiquetaFile" accept="application/pdf">
      </div>
      <button class="btn" onclick="subirEtiqueta()">⬆ Subir</button>
    </div>
    <div class="progress-bar" id="progressBar"><div class="fill"></div></div>
  `;
}

function formatBytes(bytes){
  if(!bytes) return '';
  const mb = bytes/1024/1024;
  return mb >= 1 ? mb.toFixed(1)+" MB" : (bytes/1024).toFixed(0)+" KB";
}

function sanitizeSegment(str){
  return (str||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_+|_+$/g,"") || "sin_nombre";
}

async function subirEtiqueta(){
  const nombreEtiqueta = document.getElementById("nuevaEtiquetaNombre").value.trim();
  const fileInput = document.getElementById("nuevaEtiquetaFile");
  const file = fileInput.files[0];
  if(!nombreEtiqueta){ showMsg("Ponele un nombre a la etiqueta (ej: Delantera).", "err"); return; }
  if(!file){ showMsg("Elegí un archivo PDF.", "err"); return; }
  if(file.type !== "application/pdf"){ showMsg("Solo se permiten archivos PDF.", "err"); return; }

  const progressWrap = document.getElementById("progressBar");
  progressWrap.style.display = "block";

  const path = `${CURRENT_BRAND}/${sanitizeSegment(SELECTED_PRODUCT.nombre)}/${sanitizeSegment(nombreEtiqueta)}_${Date.now()}.pdf`;
  try{
    const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/pdf",
        "x-upsert": "true"
      },
      body: file
    });
    if(!uploadRes.ok) throw new Error(await uploadRes.text());

    await sbPost("etiqueta_files", {
      business_line: CURRENT_BRAND,
      producto_ref_id: SELECTED_PRODUCT.ref_id,
      producto_codigo: SELECTED_PRODUCT.codigo || null,
      producto_nombre: SELECTED_PRODUCT.nombre,
      etiqueta_nombre: nombreEtiqueta,
      storage_path: path,
      file_name: file.name,
      file_size_bytes: file.size
    });

    showMsg("Etiqueta subida correctamente.");
    progressWrap.style.display = "none";
    if(CURRENT_BRAND==='clientes' && !CLIENTE_NOMBRES.includes(SELECTED_PRODUCT.nombre)){
      CLIENTE_NOMBRES.push(SELECTED_PRODUCT.nombre);
      CLIENTE_NOMBRES.sort();
    }
    renderDetalle();
    if(BRANDS[CURRENT_BRAND].source==='table') renderProdList(); else renderClienteList();
  }catch(e){
    progressWrap.style.display = "none";
    showMsg("Error subiendo la etiqueta: "+e.message, "err");
  }
}

async function eliminarEtiqueta(id){
  if(!confirm("¿Eliminar esta etiqueta? No se puede deshacer.")) return;
  try{
    await sbDel("etiqueta_files", id);
    showMsg("Etiqueta eliminada.");
    renderDetalle();
    await loadBrandData();
    if(BRANDS[CURRENT_BRAND].source==='table') renderProdList(); else renderClienteList();
  }catch(e){
    showMsg("Error al eliminar: "+e.message, "err");
  }
}

renderPills();
selectBrand("bocado");
</script>
</body>
</html>
